<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme Toggle – Sun & Moon</title>

    <style>
      /* =========================================
       Zentrale CSS-Konfiguration
       ========================================= */

      :root {
        --toggle-color: #ff4d4d;
        --toggle-background: #121212;
        --toggle-size: 48px;

        --animation-duration: 0.5s;
        --animation-easing: cubic-bezier(0.4, 0, 0.2, 1);

        /* Mondsichel */
        --moon-offset: 5px;
        --moon-tilt: -30deg;
        --moon-radius: 9.5px;
      }

      /* =========================================
       Grundlayout
       ========================================= */

      body {
        background: var(--toggle-background);

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;
        margin: 0;
      }

      /* =========================================
       Button
       ========================================= */

      .theme-toggle {
        cursor: pointer;

        background: none;
        border: none;
        padding: 0;
        margin: 0;

        color: var(--toggle-color);

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .theme-toggle svg {
        display: block;
        width: var(--toggle-size);
        height: var(--toggle-size);
        overflow: visible;
      }

      /* =========================================
       Mondsichel-Ausschnitt
       ========================================= */

      .theme-toggle #moon-cutout {
        /* Ausgangsposition außerhalb des Sonnenkerns */
        transform: translate(14px, -14px);

        transform-box: view-box;
        transform-origin: 16px 16px;

        transition: transform var(--animation-duration) var(--animation-easing);
      }

      /* =========================================
       Rotation der fertigen Sichel
       ========================================= */

      .theme-toggle .moon-shape {
        transform: rotate(0deg);

        transform-box: view-box;
        transform-origin: 16px 16px;

        transition: transform var(--animation-duration) var(--animation-easing);
      }

      /* =========================================
       Sonnenstrahlen
       ========================================= */

      .theme-toggle .sun-beams {
        transform-origin: 16px 16px;

        transition:
          transform var(--animation-duration) var(--animation-easing),
          opacity 0.3s ease;

        opacity: 1;
      }

      /* =========================================
       Zustand: Mond (ausschließlich Klick)
       ========================================= */

      .theme-toggle.is-dark #moon-cutout {
        transform: translate(var(--moon-offset), 0);
      }

      .theme-toggle.is-dark .moon-shape {
        transform: rotate(var(--moon-tilt));
      }

      .theme-toggle.is-dark .sun-beams {
        transform: scale(0) rotate(90deg);
        opacity: 0;
      }

      /* =========================================
       Barrierefreiheit
       ========================================= */

      @media (prefers-reduced-motion: reduce) {
        .theme-toggle * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <button class="theme-toggle" type="button" aria-label="Theme wechseln" aria-pressed="false">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="currentColor">
        <!-- SVG-Maske: echte kreisförmige Aussparung -->

        <mask id="theme-toggle-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
          <rect width="32" height="32" fill="black" />

          <!-- Sichtbarer Grundkreis -->

          <circle cx="16" cy="16" r="8.5" fill="white" />

          <!-- Beweglicher Ausschnitt -->

          <circle id="moon-cutout" cx="16" cy="16" r="9.5" fill="black" />
        </mask>

        <!-- Mondform wird als Ganzes gedreht -->

        <g class="moon-shape" mask="url(#theme-toggle-mask)">
          <circle cx="16" cy="16" r="8.5" />
        </g>

        <!-- Sonnenstrahlen -->

        <g class="sun-beams" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M16 4.5v-3" />
          <path d="M16 30.5v-3" />

          <path d="M1.5 16h3" />
          <path d="M27.5 16h3" />

          <path d="m23.4 8.6 2.5-2.5" />
          <path d="m6 26 2.5-2.5" />

          <path d="m6 6 2.5 2.5" />
          <path d="m23.4 23.4 2.5 2.5" />
        </g>
      </svg>
    </button>

    <script>
      const button = document.querySelector('.theme-toggle');

      button.addEventListener('click', () => {
        const isDark = button.classList.toggle('is-dark');

        button.setAttribute('aria-pressed', isDark);
      });
    </script>
  </body>
</html>
