<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src ws://127.0.0.1:* ws://localhost:*; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; script-src 'unsafe-inline'" />
    <title>Seriendruck Brief-Generator v3</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&family=Open+Sans:ital,wght@0,400;0,700;1,400&display=swap" />
    <style>
      :root {
        --ink: #1c1b19;
        --mute: #6b675f;
        --line: #d9d4c7;
        --bg: #ece8de;
        --card: #fbf9f3;
        --acc: #1f4d3a;
        --acc2: #b4532a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.4 'Open Sans',
          Arial,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 9;
        background: var(--acc);
        color: #fff;
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      header h1 {
        font:
          700 17px 'Roboto',
          Arial;
        margin: 0 auto 0 0;
        letter-spacing: 0.3px;
      }
      header #docName {
        width: clamp(150px, 22vw, 260px);
        background: #fff;
        color: var(--ink);
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 6px;
        padding: 5px 10px;
      }
      button:hover {
        background: #fff;
      }
      header button {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.3);
      }
      header button:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      header .go {
        background: var(--acc2);
        border-color: var(--acc2);
        font-weight: 700;
      }
      main {
        display: grid;
        grid-template-columns: minmax(380px, 460px) 1fr;
        gap: 16px;
        padding: 16px;
        align-items: start;
      }
      @media (max-width: 1000px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      #side {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      details {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
      }
      summary {
        cursor: pointer;
        font-weight: 700;
        padding: 10px 0;
        color: var(--acc);
      }
      details[open] {
        padding-bottom: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--mute);
        margin: 8px 0 3px;
      }
      label.cb {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 13px;
        color: var(--ink);
        font-weight: 400;
        margin: 4px 0;
      }
      input[type='text'],
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        background: #fff;
      }
      textarea {
        resize: vertical;
        font-size: 13px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--mute);
        margin: 3px 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 4px 0;
      }
      .chips button {
        padding: 1px 7px;
        font-size: 12px;
        border-radius: 99px;
        color: var(--acc);
      }
      #tb {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        border: 1px solid var(--line);
        border-bottom: 0;
        border-radius: 6px 6px 0 0;
        padding: 4px;
        background: #f1eee5;
      }
      #tb button {
        padding: 2px 8px;
      }
      #ed {
        min-height: 170px;
        max-height: 320px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 0 0 6px 6px;
        background: #fff;
        padding: 8px 10px;
        font-size: 13.5px;
      }
      #ed hr[data-break] {
        border: 0;
        border-top: 2px dashed var(--acc2);
        margin: 14px 0;
        overflow: visible;
        height: 0;
        position: relative;
      }
      #ed hr[data-break]::after {
        content: 'Seitenumbruch';
        position: absolute;
        right: 0;
        top: -9px;
        background: #fff;
        color: var(--acc2);
        font-size: 11px;
        padding: 0 6px;
      }
      #ed ul,
      #ed ol {
        margin: 0.4em 0;
        padding-left: 1.4em;
      }
      #warn {
        background: #fff4e0;
        border: 1px solid #e3b866;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12.5px;
      }
      #warn:empty {
        display: none;
      }
      #pv {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      #bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
      }
      #bar select {
        width: auto;
        max-width: 260px;
      }
      #stage {
        overflow: auto;
        padding-bottom: 30px;
      }
      #view {
        transform-origin: top left;
      }
      #printArea {
        position: absolute;
        left: -99999px;
        top: 0;
        width: 210mm;
      }
      .page {
        width: 210mm;
        height: 297mm;
        background: #fff;
        position: relative;
        overflow: hidden;
        margin: 0 auto 18px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18);
        color: #000;
        line-height: var(--lh);
        font-size: var(--fs);
        font-family: var(--ff);
      }
      .page .abs {
        position: absolute;
      }
      .main {
        position: absolute;
        left: 25mm;
        right: 20mm;
        overflow: hidden;
      }
      .main > * {
        margin: 0;
      }
      .addr {
        left: 20mm;
        width: 85mm;
        height: 45mm;
        font-size: 10pt;
        line-height: 1.3;
      }
      .ret {
        font-size: 7.5pt;
        text-decoration: underline;
        margin-bottom: 1.5mm;
        white-space: nowrap;
        overflow: hidden;
      }
      .info {
        left: 125mm;
        right: 15mm;
        font-size: 9pt;
        line-height: 1.35;
      }
      .info b {
        font-weight: 700;
      }
      .subj {
        font-weight: 700;
        margin-bottom: 8mm;
      }
      .body p,
      .body div {
        margin: 0 0 0.55em;
      }
      .body ul,
      .body ol {
        margin: 0.3em 0 0.6em;
        padding-left: 1.5em;
      }
      .body ul {
        list-style: disc;
      }
      .body ol {
        list-style: decimal;
      }
      .clos {
        margin-top: 1.4em;
        white-space: pre-line;
      }
      .att {
        margin-top: 1.2em;
        font-size: 0.9em;
        white-space: pre-line;
      }
      .foot {
        left: 25mm;
        right: 20mm;
        bottom: 10mm;
        font-size: 8pt;
        color: #444;
        border-top: 0.3mm solid #bbb;
        padding-top: 1.5mm;
        display: flex;
        justify-content: space-between;
        gap: 8mm;
        line-height: 1.3;
      }
      .cont {
        left: 25mm;
        right: 20mm;
        top: 12mm;
        font-size: 8pt;
        color: #777;
        display: flex;
        justify-content: space-between;
        gap: 8mm;
      }
      .cont span:nth-child(2) {
        flex: 1;
        text-align: center;
      }
      .sendhead {
        left: 20mm;
        width: 85mm;
        line-height: 1.3;
        overflow: hidden;
      }
      .fm {
        left: 0;
        height: 0;
        border-top: 0.3mm solid #888;
      }
      .fm.sc {
        border-top-color: #9bb;
      }
      .lay-private .sendhead {
        left: 105mm;
        text-align: right;
      }
      .lay-center .sendhead {
        left: 62mm;
        width: 86mm;
        text-align: center;
      }
      .lay-center .logo {
        max-width: 40mm;
      }
      .rule {
        left: 20mm;
        right: 20mm;
        height: 0;
        border-top: 0.3mm solid #888;
      }
      .mono {
        top: 10mm;
        right: 20mm;
        width: 14mm;
        height: 14mm;
        border: 0.3mm solid #333;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 10pt/1 var(--ff);
        letter-spacing: 0.4pt;
      }
      .lay-private .mono,
      .lay-center .mono {
        right: auto;
        left: 20mm;
      }
      .logo {
        right: 20mm;
        top: 10mm;
        max-height: 20mm;
        max-width: 60mm;
      }
      .empty {
        padding: 30px;
        text-align: center;
        color: var(--mute);
      }
      #toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        background: #222;
        color: #fff;
        padding: 9px 14px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
        z-index: 99;
      }
      #toast.err {
        background: #a12a1d;
      }
      #toast.on {
        opacity: 1;
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }
        html,
        body {
          background: #fff;
        }
        header,
        main,
        #toast {
          display: none !important;
        }
        #printArea {
          position: static;
          left: auto;
          width: auto;
        }
        .page {
          margin: 0;
          box-shadow: none;
          break-after: page;
          page-break-after: always;
        }
        .page:last-child {
          break-after: auto;
          page-break-after: auto;
        }
        .fm.sc {
          display: none;
        }
        body.nofmprint .fm {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Seriendruck</h1>
      <input type="text" id="docName" aria-label="Dokumentname" title="Dokumentname für Entwurf, Export und PDF" />
      <select id="draftSel" title="Entwürfe" style="width: auto; max-width: 180px"></select>
      <button onclick="draftLoad()">Laden</button><button onclick="draftSave()">Speichern</button><button onclick="draftDel()">Löschen</button>
      <button onclick="exportJSON()">Export</button>
      <button onclick="$('jin').click()">Import</button><input type="file" id="jin" accept=".json" hidden onchange="importJSON(event)" />
      <button onclick="loadExample()">Beispiel</button>
      <button class="go" onclick="doPrint()">Drucken / PDF</button>
    </header>
    <main>
      <div id="side">
        <div id="warn"></div>

        <details open>
          <summary>1 · Empfänger &amp; Adresse</summary>
          <label>Empfängerliste (Kopfzeile + je Empfänger eine Zeile; aus Excel einfügen oder CSV laden)</label>
          <textarea id="rec" rows="6" style="font-family: monospace; white-space: pre; overflow: auto" data-k></textarea>
          <div class="row" style="margin-top: 6px">
            <button onclick="$('csv').click()">CSV / TXT laden…</button><input type="file" id="csv" accept=".csv,.txt,.tsv" hidden onchange="loadCSV(event)" />
            <select id="enc" data-k title="Zeichenkodierung der Datei">
              <option value="utf-8">UTF-8</option>
              <option value="windows-1252">Windows-1252 (Excel DE)</option>
            </select>
          </div>
          <p class="hint" id="recInfo"></p>
          <div class="chips" id="chips"></div>
          <label>Adressfeld-Vorlage (leere Zeilen werden entfernt)</label>
          <textarea id="addrT" rows="5" data-k></textarea>
          <label>Brief-Anrede (<code>{Briefanrede}</code> wird aus Anrede/Titel/Nachname gebildet)</label>
          <input type="text" id="salT" data-k />
        </details>

        <details open>
          <summary>2 · Absender &amp; Kopf</summary>
          <label>Absender (Zeile 1 = Rücksendezeile, weitere Zeilen = vollständige Absenderadresse)</label>
          <textarea id="sender" rows="5" data-k></textarea>
          <label class="cb"><input type="checkbox" id="oRet" data-k /> Rücksendezeile über Adresse</label>
          <label>Absenderadresse anzeigen</label>
          <select id="sendPos" data-k>
            <option value="head">Briefkopf (oben links)</option>
            <option value="info">Informationsblock (rechts, oberhalb)</option>
            <option value="foot">Fußzeile</option>
            <option value="none">Nicht anzeigen</option>
          </select>
          <label>Vermerk (z. B. „Einschreiben", in der Zusatzzone)</label>
          <input type="text" id="vermerk" data-k />
          <div class="row">
            <div><label>Datum</label><input type="text" id="date" data-k /></div>
            <div><label>Betreff</label><input type="text" id="subj" data-k /></div>
          </div>
          <label class="cb"><input type="checkbox" id="oAutoDate" data-k /> Datum automatisch (heute; Handeingabe nur bei ausgeschaltet)</label>
          <label class="cb"><input type="checkbox" id="oInfo" data-k /> Informationsblock anzeigen</label>
          <label>Informationsblock (je Zeile „Bezeichnung: Wert")</label>
          <textarea id="infoT" rows="4" data-k></textarea>
          <label class="cb"><input type="checkbox" id="oDate" data-k /> Datum im Informationsblock</label>
          <label class="cb"><input type="checkbox" id="oId" data-k /> Brief-ID anzeigen</label>
          <div class="row">
            <div><label>Brief-ID Präfix</label><input type="text" id="idPre" data-k /></div>
            <div><label>Startnummer</label><input type="text" id="idStart" data-k /></div>
          </div>
          <label class="cb"><input type="checkbox" id="oLogo" data-k /> Logo anzeigen</label>
          <div class="row">
            <button onclick="$('logoIn').click()">Logo laden…</button
            ><button
              onclick="
                logo = null;
                upd();
              "
            >
              Logo entfernen
            </button>
          </div>
          <input type="file" id="logoIn" accept="image/*" hidden onchange="loadLogo(event)" />
        </details>

        <details open>
          <summary>3 · Brieftext</summary>
          <div id="tb">
            <button onmousedown="event.preventDefault()" onclick="cmd('bold')"><b>B</b></button>
            <button onmousedown="event.preventDefault()" onclick="cmd('italic')"><i>I</i></button>
            <button onmousedown="event.preventDefault()" onclick="cmd('underline')"><u>U</u></button>
            <button onmousedown="event.preventDefault()" onclick="cmd('justifyLeft')" title="Links">⇤</button>
            <button onmousedown="event.preventDefault()" onclick="cmd('justifyFull')" title="Blocksatz">☰</button>
            <button onmousedown="event.preventDefault()" onclick="cmd('insertUnorderedList')">• Liste</button>
            <button onmousedown="event.preventDefault()" onclick="cmd('insertOrderedList')">1. Liste</button>
            <button onmousedown="event.preventDefault()" onclick="cmd('removeFormat')">Tx</button>
            <button onmousedown="event.preventDefault()" onclick="pbreak()" style="color: var(--acc2)">+ Seitenumbruch</button>
          </div>
          <div id="ed" contenteditable="true"></div>
          <p class="hint">Platzhalter per Klick einfügen: siehe Chips oben. Gilt in allen Textfeldern.</p>
          <label>Grußformel &amp; Signatur</label>
          <textarea id="clos" rows="4" data-k></textarea>
          <label class="cb"><input type="checkbox" id="oAtt" data-k /> Anlagen / Verteiler anzeigen</label>
          <textarea id="att" rows="2" data-k placeholder="Anlagen: …"></textarea>
        </details>

        <details>
          <summary>4 · Layout &amp; Ausgabe</summary>
          <label>Layout-Vorlage (ändert nur das Aussehen, nicht die Inhalte)</label>
          <select id="layout" data-k>
            <option value="business">Geschäftsbrief – Absender links oben</option>
            <option value="private">Privatbrief – Absender rechts oben</option>
            <option value="center">Zentriert – Absender mittig</option>
            <option value="line">Linie – Absender links mit feiner Trennlinie</option>
          </select>
          <label class="cb"><input type="checkbox" id="oMono" data-k /> Monogramm anzeigen (entfällt bei geladenem Logo)</label>
          <input type="text" id="monoT" data-k maxlength="3" placeholder="Monogramm (leer = Initialen des Absenders)" />
          <div class="row">
            <div>
              <label>Norm-Form</label
              ><select id="form" data-k>
                <option value="B">Form B (Adresse 45 mm)</option>
                <option value="A">Form A (Adresse 27 mm)</option>
              </select>
            </div>
            <div>
              <label>Schriftart</label
              ><select id="ff" data-k>
                <option>Arial</option>
                <option>Roboto</option>
                <option>Open Sans</option>
                <option>Times New Roman</option>
                <option>Calibri</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div>
              <label>Schriftgröße</label
              ><select id="fs" data-k>
                <option>10pt</option>
                <option selected>11pt</option>
                <option>12pt</option>
              </select>
            </div>
            <div>
              <label>Zeilenabstand</label
              ><select id="lh" data-k>
                <option>1.15</option>
                <option selected>1.3</option>
                <option>1.5</option>
              </select>
            </div>
          </div>
          <label class="cb"><input type="checkbox" id="oFmPrev" data-k /> Falz-/Lochmarken in der Vorschau</label>
          <label class="cb"><input type="checkbox" id="oFmPrint" data-k /> Falz-/Lochmarken im Ausdruck (Blankopapier)</label>
          <label class="cb"><input type="checkbox" id="oNum" data-k /> Seitenzahl „Seite x von y"</label>
          <label class="cb"><input type="checkbox" id="oCont" data-k /> Kopf auf Folgeseiten</label>
          <label class="cb"><input type="checkbox" id="oFoot" data-k /> Fußzeile anzeigen</label>
          <textarea id="foot" rows="2" data-k></textarea>
          <label>Druckumfang</label>
          <select id="scope" data-k>
            <option value="all">Alle Briefe</option>
            <option value="one">Nur angezeigten Brief</option>
          </select>
        </details>
      </div>

      <section id="pv">
        <div id="bar">
          <b>Vorschau</b>
          <select id="sel" onchange="render()"></select>
          <button onclick="step(-1)">‹</button><button onclick="step(1)">›</button>
          <label class="cb" style="margin: 0 0 0 auto">Zoom <input type="range" id="zoom" min="40" max="130" value="80" oninput="zoomIt()" style="width: 110px" /></label>
          <span id="pgInfo" class="hint"></span>
        </div>
        <div id="stage"><div id="view"></div></div>
      </section>
    </main>
    <div id="printArea"></div>
    <div id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const NL = String.fromCharCode(10),
        TAB = String.fromCharCode(9),
        CR = String.fromCharCode(13);
      const KEYS = ['docName', 'rec', 'enc', 'addrT', 'salT', 'sender', 'oRet', 'sendPos', 'layout', 'oMono', 'monoT', 'vermerk', 'date', 'subj', 'oAutoDate', 'oInfo', 'infoT', 'oDate', 'oId', 'idPre', 'idStart', 'oLogo', 'clos', 'oAtt', 'att', 'form', 'ff', 'fs', 'lh', 'oFmPrev', 'oFmPrint', 'oNum', 'oCont', 'oFoot', 'foot', 'scope'];
      let logo = null,
        timer = null,
        rows = [],
        cols = [];
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      function toast(m, err) {
        const t = $('toast');
        t.textContent = m;
        t.className = (err ? 'err ' : '') + 'on';
        clearTimeout(t._t);
        t._t = setTimeout(() => (t.className = ''), 2600);
      }

      /* ---------- Bereinigung des Brieftexts (Allowlist) ---------- */
      const OK = new Set(['P', 'DIV', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'UL', 'OL', 'LI', 'HR']);
      function clean(html) {
        const d = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html');
        (function walk(n) {
          [...n.childNodes].forEach((c) => {
            if (c.nodeType === 3) return;
            if (c.nodeType !== 1) {
              c.remove();
              return;
            }
            if (['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TEMPLATE'].includes(c.tagName)) {
              c.remove();
              return;
            }
            walk(c);
            if (!OK.has(c.tagName)) {
              c.replaceWith(...c.childNodes);
              return;
            }
            if (c.tagName === 'HR' && !c.hasAttribute('data-break')) {
              c.remove();
              return;
            }
            const al = (c.style && c.style.textAlign) || c.getAttribute('align') || '';
            [...c.attributes].forEach((a) => c.removeAttribute(a.name));
            if (c.tagName === 'HR') c.setAttribute('data-break', '1');
            else if (['left', 'center', 'right', 'justify'].includes(al)) c.style.textAlign = al;
          });
        })(d.body);
        return d.body.innerHTML;
      }

      /* ---------- CSV ---------- */
      function parseCSV(t) {
        t = t.split(CR).join('');
        if (t.charCodeAt(0) === 65279) t = t.slice(1);
        const first = t.split(NL)[0] || '';
        const cnt = (c) => first.split(c).length;
        const dl = [
          [TAB, cnt(TAB)],
          [';', cnt(';')],
          [',', cnt(',')],
        ].sort((a, b) => b[1] - a[1])[0][0];
        const out = [];
        let r = [],
          f = '',
          q = false;
        for (let i = 0; i < t.length; i++) {
          const c = t[i];
          if (q) {
            if (c == '"') {
              if (t[i + 1] == '"') {
                f += '"';
                i++;
              } else q = false;
            } else f += c;
          } else if (c == '"') q = true;
          else if (c == dl) {
            r.push(f);
            f = '';
          } else if (c == NL) {
            r.push(f);
            f = '';
            out.push(r);
            r = [];
          } else f += c;
        }
        if (f !== '' || r.length) {
          r.push(f);
          out.push(r);
        }
        return { data: out.filter((x) => x.some((v) => v.trim())), dl };
      }
      function loadCSV(e) {
        const file = e.target.files[0];
        if (!file) return;
        if ($('rec').value.trim() && !confirm('Vorhandene Empfängerliste ersetzen?')) {
          e.target.value = '';
          return;
        }
        const rd = new FileReader();
        rd.onload = () => {
          const { data, dl } = parseCSV(rd.result);
          $('rec').value = data.map((r) => r.join(TAB)).join(NL);
          upd();
          toast(Math.max(0, data.length - 1) + ' Empfänger geladen');
        };
        rd.readAsText(file, $('enc').value);
        e.target.value = '';
      }
      function readRows() {
        const t = $('rec').value;
        if (!t.trim()) {
          cols = [];
          rows = [];
          return;
        }
        const { data } = parseCSV(t);
        cols = data[0].map((h) => h.trim());
        rows = data.slice(1).map((r) => {
          const o = {};
          cols.forEach((c, i) => (o[c] = (r[i] || '').trim()));
          return o;
        });
      }

      /* ---------- Platzhalter ---------- */
      const missing = new Set(),
        empties = new Set();
      function briefanrede(r) {
        const g = (k) => {
          const c = Object.keys(r).find((x) => x.toLowerCase() === k);
          return c ? r[c] : '';
        };
        const a = g('anrede').toLowerCase(),
          t = g('titel'),
          n = g('nachname');
        if (!n) return 'Sehr geehrte Damen und Herren,';
        const nm = (t ? t + ' ' : '') + n;
        if (/^frau/.test(a)) return 'Sehr geehrte Frau ' + nm + ',';
        if (/^herr/.test(a)) return 'Sehr geehrter Herr ' + nm + ',';
        return 'Sehr geehrte Damen und Herren,';
      }
      function ctx(r, i) {
        const c = { ...r };
        const set = (k, v) => (c[k] = v);
        set('Briefanrede', briefanrede(r));
        set('Datum', $('date').value);
        set('Betreff', $('subj').value);
        set('Brief_ID', ($('idPre').value || '') + ((parseInt($('idStart').value) || 1) + i));
        return c;
      }
      function look(c, k) {
        const kk = Object.keys(c).find((x) => x.toLowerCase() === k.toLowerCase());
        return kk === undefined ? undefined : c[kk];
      }
      function subText(s, c) {
        return String(s).replace(/{([^{}]+)}/g, (m, k) => {
          if (k.includes(NL)) return m;
          const v = look(c, k.trim());
          if (v === undefined) {
            missing.add(m);
            return m;
          }
          if (v === '' && !/^(titel|zusatz)/i.test(k.trim())) empties.add(m);
          return v;
        });
      }
      function subHtml(html, c) {
        const d = document.createElement('div');
        d.innerHTML = html;
        const w = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
        const ns = [];
        while (w.nextNode()) ns.push(w.currentNode);
        ns.forEach((n) => {
          n.nodeValue = subText(n.nodeValue, c);
        });
        return d;
      }

      /* ---------- Seitenaufbau ---------- */
      function block() {
        return document.createElement('div');
      }
      function makePage(o, cfg, first, idx) {
        const p = block();
        p.className = 'page lay-' + cfg.layout;
        p.style.setProperty('--ff', cfg.ff);
        p.style.setProperty('--fs', cfg.fs);
        p.style.setProperty('--lh', cfg.lh);
        const A = cfg.form === 'A';
        let h = '';
        const marks = [A ? 87 : 105, A ? 192 : 210];
        const fm = cfg.fmPrev || cfg.fmPrint;
        if (fm) {
          h += marks.map((m) => '<div class="abs fm ' + (cfg.fmPrint ? '' : 'sc') + '" style="top:' + m + 'mm;width:5mm"></div>').join('') + ('<div class="abs fm ' + (cfg.fmPrint ? '' : 'sc') + '" style="top:148.5mm;width:8mm"></div>');
        }
        let top = first ? (A ? 85 : 98.5) : cfg.cont ? 25 : 20;
        if (first) {
          const ad = cfg.addr.map(esc).join('<br>');
          const top0 = A ? 27 : 45;
          h += '<div class="abs addr" style="top:' + top0 + 'mm">' + (cfg.vermerk ? '<div style="font-size:8pt;font-weight:700;height:5mm">' + esc(cfg.vermerk) + '</div>' : '<div style="height:5mm"></div>') + (cfg.ret ? '<div class="ret">' + esc(cfg.ret) + '</div>' : '') + ad + '</div>';
          if (cfg.infoRows.length) h += '<div class="abs info" style="top:' + (top0 + 5) + 'mm">' + cfg.infoRows.map((r) => '<div>' + r + '</div>').join('') + '</div>';
          if (cfg.sendBlock.length && cfg.sendPos === 'head') h += '<div class="abs sendhead" style="top:10mm;height:' + (top0 - 12) + 'mm;font-size:' + (A ? '8pt' : '9pt') + '">' + cfg.sendBlock.map(esc).join('<br>') + '</div>';
          if (cfg.layout === 'line' && cfg.sendBlock.length && cfg.sendPos === 'head') h += '<div class="abs rule" style="top:' + (top0 - 3) + 'mm"></div>';
          if (!cfg.logo && cfg.mono) h += '<div class="abs mono">' + esc(cfg.mono) + '</div>';
          if (cfg.logo) h += '<img class="abs logo" src="' + cfg.logo + '" alt="">';
        } else if (cfg.cont) {
          h += '<div class="abs cont"><span>' + esc(cfg.contL) + '</span><span>' + esc(cfg.contD) + '</span><span class="pn"></span></div>';
        }
        const showNum = cfg.num && !cfg.cont;
        const bot = cfg.foot || showNum ? 22 : 15;
        h += '<div class="main" style="top:' + top + 'mm;bottom:' + bot + 'mm"></div>';
        if (cfg.foot || showNum) h += '<div class="abs foot"><div>' + (cfg.foot ? cfg.footH : '') + '</div><div class="num" style="white-space:nowrap">' + (showNum ? '<span class="pn"></span>' : '') + '</div></div>';
        p.innerHTML = h;
        return p;
      }
      function monogram(t, sl) {
        if (t) return t.toUpperCase().slice(0, 3);
        const nm = (sl[1] || sl[0] || '').split(/[·,|]/)[0];
        const w = nm.split(/\s+/).filter((x) => x && !/^(gmbh|mbh|ag|ug|kg|ohg|se|e\.?k\.?|co\.?|&|und)$/i.test(x));
        return w
          .slice(0, 2)
          .map((x) => [...x][0].toUpperCase())
          .join('');
      }
      function buildLetter(r, i, host) {
        const c = ctx(r, i);
        const cfg = {
          form: $('form').value,
          ff: $('ff').value,
          fs: $('fs').value,
          lh: $('lh').value,
          fmPrev: $('oFmPrev').checked,
          fmPrint: $('oFmPrint').checked,
          num: $('oNum').checked,
          cont: $('oCont').checked,
          foot: $('oFoot').checked,
          addr: subText($('addrT').value, c)
            .split(NL)
            .map((s) => s.trim())
            .filter(Boolean),
          ret: $('oRet').checked ? subText($('sender').value.split(NL)[0] || '', c) : '',
          vermerk: subText($('vermerk').value, c),
          subj: subText($('subj').value, c),
          logo: $('oLogo').checked ? logo : null,
          footH: subText($('foot').value, c).split(NL).map(esc).join('<br>'),
        };
        cfg.layout = $('layout').value || 'business';
        const sl = subText($('sender').value, c)
          .split(NL)
          .map((x) => x.trim())
          .filter(Boolean);
        cfg.sendPos = $('sendPos').value;
        cfg.sendBlock = cfg.sendPos === 'none' ? [] : sl.length > 1 ? sl.slice(1) : sl;
        if (cfg.sendPos === 'foot' && cfg.sendBlock.length) {
          cfg.foot = true;
          cfg.footH = esc(cfg.sendBlock.join(' · ')) + (cfg.footH ? '<br>' + cfg.footH : '');
        }
        cfg.mono = $('oMono').checked ? monogram($('monoT').value.trim(), sl) : '';
        cfg.contL = cfg.addr[0] || '';
        cfg.contD = subText($('date').value, c);
        cfg.infoRows = [];
        if (cfg.sendPos === 'info' && cfg.sendBlock.length) cfg.infoRows.push('<b>' + cfg.sendBlock.map(esc).join('<br>') + '</b><br>&nbsp;');
        if ($('oInfo').checked)
          subText($('infoT').value, c)
            .split(NL)
            .filter((s) => s.trim())
            .forEach((l) => {
              const x = l.indexOf(':');
              cfg.infoRows.push(x > 0 ? '<b>' + esc(l.slice(0, x)) + ':</b> ' + esc(l.slice(x + 1).trim()) : esc(l));
            });
        if ($('oDate').checked) cfg.infoRows.push('<b>Datum:</b> ' + esc(subText($('date').value, c)));
        if ($('oId').checked) cfg.infoRows.push('<b>Brief-ID:</b> ' + esc(c.Brief_ID));

        // Inhalt als Blockliste
        const body = subHtml(clean($('ed').innerHTML), c);
        const items = [];
        const first = block();
        first.className = 'subj';
        first.textContent = cfg.subj;
        const sal = block();
        sal.textContent = subText($('salT').value, c);
        sal.style.marginBottom = '1em';
        const pre = [first, sal];
        [...body.childNodes].forEach((n) => {
          if (n.nodeType === 3) {
            if (n.nodeValue.trim()) {
              const p = document.createElement('p');
              p.textContent = n.nodeValue;
              items.push(p);
            }
          } else if (n.tagName === 'HR') items.push('BREAK');
          else items.push(n);
        });
        const clos = block();
        clos.className = 'clos';
        clos.textContent = subText($('clos').value, c);
        const tail = [clos];
        if ($('oAtt').checked && $('att').value.trim()) {
          const a = block();
          a.className = 'att';
          a.textContent = subText($('att').value, c);
          tail.push(a);
        }

        const pages = [];
        const newPage = () => {
          const p = makePage(null, cfg, pages.length === 0, i);
          host.appendChild(p);
          pages.push(p);
          const m = p.querySelector('.main');
          const b = block();
          b.className = 'body';
          m.appendChild(b);
          return { p, m, b };
        };
        let cur = newPage();
        pre.forEach((n) => cur.m.insertBefore(n, cur.b));
        const over = () => cur.m.scrollHeight > cur.m.clientHeight + 1;
        const add = (n) => {
          cur.b.appendChild(n);
          if (over() && cur.b.children.length > 1) {
            cur.b.removeChild(n);
            cur = newPage();
            cur.b.appendChild(n);
          }
        };
        items.forEach((n) => {
          if (n === 'BREAK') {
            cur = newPage();
            return;
          }
          add(n);
        });
        tail.forEach((n) => {
          cur.m.appendChild(n);
          if (over() && cur.m.children.length > 1) {
            cur.m.removeChild(n);
            cur = newPage();
            cur.m.appendChild(n);
          }
        });
        pages.forEach((p, k) => {
          const nm = p.querySelector('.pn');
          if (nm && cfg.num) nm.textContent = 'Seite ' + (k + 1) + ' von ' + pages.length;
        });
        return pages.length;
      }

      /* ---------- Rendern ---------- */
      function fillSel() {
        const s = $('sel'),
          cur = s.value;
        s.innerHTML =
          '<option value="all">Alle (' +
          rows.length +
          ')</option>' +
          rows
            .map((r, i) => {
              const nm = [r.Vorname, r.Nachname].filter(Boolean).join(' ') || r[cols[0]] || 'Empfänger';
              return '<option value="' + i + '">' + (i + 1) + ': ' + esc(nm) + '</option>';
            })
            .join('');
        s.value = [...s.options].some((o) => o.value === cur) ? cur : rows.length ? '0' : 'all';
      }
      function render() {
        missing.clear();
        empties.clear();
        const v = $('view');
        v.innerHTML = '';
        if (!rows.length) {
          v.innerHTML = '<div class="empty">Keine Empfänger. Daten einfügen oder „Beispiel" laden.</div>';
          $('pgInfo').textContent = '';
          showWarn();
          return;
        }
        const sel = $('sel').value;
        const list = sel === 'all' ? rows.map((r, i) => [r, i]) : [[rows[+sel], +sel]];
        let tot = 0;
        list.forEach(([r, i]) => (tot += buildLetter(r, i, v)));
        $('pgInfo').textContent = list.length + ' Brief(e), ' + tot + ' Seite(n)';
        showWarn();
        zoomIt();
      }
      function showWarn() {
        let h = '';
        if (missing.size) h += '⚠ Unbekannte Platzhalter: <b>' + [...missing].map(esc).join(', ') + '</b><br>';
        if (empties.size) h += '⚠ Leere Werte bei: <b>' + [...empties].map(esc).join(', ') + '</b> (in mindestens einem Brief)';
        $('warn').innerHTML = h;
      }
      function zoomIt() {
        const z = $('zoom').value / 100;
        $('view').style.zoom = z;
      }
      function step(d) {
        const s = $('sel');
        let n = s.selectedIndex + d;
        if (n < 0 || n >= s.options.length) return;
        s.selectedIndex = n;
        render();
      }
      function chips() {
        const names = [...cols, 'Briefanrede', 'Datum', 'Betreff', 'Brief_ID'];
        $('chips').innerHTML = names.map((n) => '<button onmousedown="event.preventDefault()" onclick="insVar(' + "'" + '' + esc(n).replace(/'/g, '') + '' + "'" + ')">{' + esc(n) + '}</button>').join('');
        $('recInfo').textContent = rows.length ? rows.length + ' Empfänger, Spalten: ' + cols.join(', ') : 'Noch keine Daten. Erste Zeile = Spaltennamen (z. B. Anrede;Vorname;Nachname;Straße;PLZ;Ort).';
      }
      let lastFocus = null;
      document.addEventListener('focusin', (e) => {
        if (e.target.matches('input[type=text],textarea,#ed')) lastFocus = e.target;
      });
      function insVar(n) {
        const t = lastFocus && lastFocus.id !== 'rec' ? lastFocus : $('ed');
        const s = '{' + n + '}';
        if (t.id === 'ed') {
          t.focus();
          document.execCommand('insertText', false, s);
        } else {
          t.focus();
          const a = t.selectionStart,
            b = t.selectionEnd;
          t.value = t.value.slice(0, a) + s + t.value.slice(b);
          t.selectionStart = t.selectionEnd = a + s.length;
        }
        upd();
      }
      function cmd(c) {
        $('ed').focus();
        document.execCommand(c);
        upd();
      }
      function pbreak() {
        $('ed').focus();
        document.execCommand('insertHTML', false, '<hr data-break="1"><p><br></p>');
        upd();
      }
      $('ed').addEventListener('paste', (e) => {
        e.preventDefault();
        const h = e.clipboardData.getData('text/html');
        const t = e.clipboardData.getData('text/plain');
        document.execCommand('insertHTML', false, h ? clean(h) : esc(t).split(NL).join('<br>'));
        upd();
      });
      $('ed').addEventListener('input', () => upd());

      /* ---------- Zustand ---------- */
      function getState() {
        const d = { v: 3, logo, body: clean($('ed').innerHTML) };
        KEYS.forEach((k) => {
          const e = $(k);
          d[k] = e.type === 'checkbox' ? e.checked : e.value;
        });
        return d;
      }
      function setState(d) {
        KEYS.forEach((k) => {
          if (d[k] === undefined) return;
          const e = $(k);
          if (e.type === 'checkbox') e.checked = !!d[k];
          else e.value = d[k];
        });
        if (d.layout === undefined) $('layout').value = 'business';
        if (!$('layout').value) $('layout').value = 'business';
        if (d.oMono === undefined) {
          $('oMono').checked = false;
          $('monoT').value = '';
        }
        $('ed').innerHTML = clean(d.body || '');
        logo = typeof d.logo === 'string' && /^data:image[/](png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(d.logo) ? d.logo : null;
      }
      function save() {
        try {
          localStorage.setItem('sbg3_auto', JSON.stringify(getState()));
        } catch (e) {
          toast('Automatisches Speichern fehlgeschlagen (Speicher voll?). Bitte Export nutzen.', true);
        }
      }
      function syncDocumentName() {
        const name = $('docName').value.trim();
        document.title = name || 'Seriendruck';
      }
      $('docName').addEventListener('input', () => {
        syncDocumentName();
        save();
      });
      function upd() {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const ad = $('oAutoDate').checked;
          if (ad) $('date').value = today();
          $('date').readOnly = ad;
          readRows();
          fillSel();
          chips();
          render();
          save();
        }, 350);
      }
      const today = () => new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' });
      document.querySelectorAll('[data-k]').forEach((e) => {
        e.addEventListener('input', upd);
        e.addEventListener('change', upd);
      });

      /* ---------- Entwürfe, Export, Import ---------- */
      function drafts() {
        try {
          return JSON.parse(localStorage.getItem('sbg3_drafts') || '{}');
        } catch (e) {
          return {};
        }
      }
      function fillDrafts() {
        const d = drafts();
        $('draftSel').innerHTML =
          '<option value="">Entwürfe…</option>' +
          Object.keys(d)
            .map((k) => '<option>' + esc(k) + '</option>')
            .join('');
      }
      function draftSave() {
        const n = $('docName').value.trim();
        if (!n) return toast('Bitte Dokumentnamen eingeben', true);
        $('docName').value = n;
        syncDocumentName();
        const d = drafts();
        if (d[n] && !confirm('Entwurf „' + n + '“ überschreiben?')) return;
        d[n] = getState();
        try {
          localStorage.setItem('sbg3_drafts', JSON.stringify(d));
          fillDrafts();
          $('draftSel').value = n;
          toast('Entwurf gespeichert');
        } catch (e) {
          toast('Speicher voll. Bitte Export nutzen.', true);
        }
      }
      function draftLoad() {
        const n = $('draftSel').value;
        if (!n) return toast('Bitte Entwurf wählen', true);
        if (!confirm('Aktuelle Eingaben durch Entwurf „' + n + '“ ersetzen?')) return;
        const d = drafts()[n];
        if (!d) return toast('Entwurf nicht gefunden', true);
        setState({ ...d, docName: d.docName || n });
        syncDocumentName();
        upd();
        toast('Entwurf geladen');
      }
      function draftDel() {
        const n = $('draftSel').value;
        if (!n) return;
        if (!confirm('Entwurf „' + n + '“ löschen?')) return;
        const d = drafts();
        delete d[n];
        localStorage.setItem('sbg3_drafts', JSON.stringify(d));
        fillDrafts();
      }
      function exportJSON() {
        const b = new Blob([JSON.stringify(getState(), null, 2)], { type: 'application/json' });
        const name = $('docName').value.trim() || 'Seriendruck';
        const filename =
          name
            .replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_')
            .replace(/[. ]+$/, '')
            .trim() || 'Seriendruck';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = filename + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 500);
      }
      function importJSON(e) {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (!confirm('Aktuelle Eingaben durch Import ersetzen?')) return;
            setState({ ...d, docName: d.docName || f.name.replace(/\.json$/i, '') });
            syncDocumentName();
            upd();
            toast('Importiert');
          } catch (x) {
            toast('Ungültige JSON-Datei', true);
          }
        };
        r.readAsText(f);
        e.target.value = '';
      }
      function loadLogo(e) {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          const im = new Image();
          im.onload = () => {
            const s = Math.min(1, 600 / im.width),
              c = document.createElement('canvas');
            c.width = im.width * s;
            c.height = im.height * s;
            c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
            logo = c.toDataURL('image/png');
            $('oLogo').checked = true;
            upd();
            toast('Logo geladen');
          };
          im.onerror = () => toast('Bild nicht lesbar', true);
          im.src = r.result;

        e.target.value = '';

      /* ---------- Drucken ---------- */
      function doPrint() {
        readRows();
        if (!rows.length) return toast('Keine Empfänger', true);
        const pa = $('printArea');
        pa.innerHTML = '';
        const sel = $('sel').value;
        const list = $('scope').value === 'one' && sel !== 'all' ? [[rows[+sel], +sel]] : rows.map((r, i) => [r, i]);

        empties.clear();
        list.forEach(([r, i]) => buildLetter(r, i, pa));
